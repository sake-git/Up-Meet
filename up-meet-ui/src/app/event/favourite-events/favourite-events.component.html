<div class="card-container">
  <div
    class="card"
    *ngFor="let event of events"
    [routerLink]="'display-event/' + event.id"
  >
    <img [src]="event.imgUrl" />
    <p>{{ event.name }}</p>
    <p>{{ event.location }}</p>
    <p>
      {{ event.eventDateTime | date : "MMM d, yyyy hh:mm a" }}
    </p>
  </div>
</div>
